[project]
name = "docuprocess"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["receipt-engine==1.0.0", "docuprocess-api==1.0.0", "docuprocess-worker==1.0.0"]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx==0.28.1", "moto[s3,dynamodb,sns]==5.1.4", "ruff==0.11.7", "mypy==1.15.0", "reportlab==4.4.0"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["app/receipt_engine", "app/api", "app/worker"]

[tool.uv.sources]
receipt-engine = { workspace = true }
docuprocess-api = { workspace = true }
docuprocess-worker = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["app/receipt_engine/tests", "app/api/tests", "app/worker/tests", "tests"]
markers = ["ocr: requires the real Tesseract executable"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
