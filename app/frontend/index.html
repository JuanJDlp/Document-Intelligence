<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'"><link rel="stylesheet" href="assets/app.css"><title>DocuProcess Cloud</title></head><body><main><p class="eyebrow">Document workspace</p><h1>DocuProcess Cloud</h1><p>Upload a receipt or invoice and follow its processing status.</p><p id="notice" role="status"></p><div class="columns"><section><h2>Sign in</h2><form method="post" id="login"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username" aria-describedby="notice"><label for="password">Password</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" aria-describedby="notice"><button disabled>Sign in</button></form></section><section><h2>Create an account</h2><form method="post" id="register"><label for="full-name">Full name</label><input id="full-name" name="full_name" required maxlength="200" autocomplete="name" aria-describedby="notice"><label for="new-email">Email</label><input id="new-email" name="email" type="email" required maxlength="254" autocomplete="email" aria-describedby="notice"><label for="new-password">Password</label><input id="new-password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password" aria-describedby="password-help notice"><p id="password-help">12–128 characters, including a letter and a number.</p><button disabled>Create account</button></form></section></div></main><script type="module" src="assets/auth.js"></script></body></html>
